# Local services for NEXUS development.
#   Postgres 18 stands in for Neon; MinIO stands in for Cloudflare R2.
#   Start: docker compose up -d    Stop: docker compose down
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO no longer publishes community images to Docker Hub; Chainguard
  # builds the same server. It runs as a non-root user (65532).
  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - miniodata:/data

  # Creates the attachments bucket; restarts until MinIO accepts connections.
  minio-init:
    image: chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://nexus:nexus-dev-secret@minio:9000
    command: ['mb', '--ignore-existing', 'local/nexus-attachments-dev']
    restart: on-failure

volumes:
  pgdata:
  miniodata:
