# CI stages 1 (static), 2 (unit) and 3 (database) from TDD Section I, CI pipeline stages.
# Stages 4-8 (preview DB, build, E2E, deploy, release) arrive in later phases.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Stage 1 - Static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Prettier
        run: pnpm format:check

      # Scans the full history with the pinned gitleaks image. The gitleaks
      # action scans only the pushed range and fails when that range starts at
      # the root commit (for example after a history rewrite).
      - name: Secret scan
        # safe.directory: the container user differs from the checkout's owner.
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Dependency audit
        run: pnpm audit --audit-level high

  unit:
    name: Stage 2 - Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm turbo run test

      - name: Coverage summary
        if: always()
        run: |
          (cd apps/mobile && node ../../scripts/coverage-summary.mjs coverage/coverage-summary.json mobile 2) || true
          (cd packages/shared && node ../../scripts/coverage-summary.mjs coverage/coverage-summary.json shared 2) || true

      # T-33: the spec is regenerated from the routes (a unit test fails if it is
      # stale) and linted here.
      - name: OpenAPI lint
        run: npx -y @redocly/cli@2.76.0 lint docs/api/openapi.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Stage 3 - Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations match the schema
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name ci_drift_check | tee drift.log
          if ! grep -q "No schema changes" drift.log; then
            echo "src/db/schema has changes without a committed migration. Run pnpm db:generate."
            exit 1
          fi

      # Unit and database projects together: most API code is exercised only by
      # the database tests, so coverage is measured across both.
      - name: Database and unit tests with coverage (PostgreSQL 18 via Testcontainers)
        working-directory: apps/api
        # TDD Section L, Coverage targets: 80 % lines and 70 % branches overall.
        run: >-
          pnpm exec vitest run --coverage --reporter=default --reporter=github-actions
          --coverage.thresholds.lines=80 --coverage.thresholds.branches=70

      - name: Coverage summary
        if: always()
        working-directory: apps/api
        run: node ../../scripts/coverage-summary.mjs coverage/coverage-summary.json api 3 || true

  image:
    name: Stage 4 - Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t nexus-api .

      # The image must migrate a fresh database and come up ready, as it does on
      # the host (MIGRATE_ON_START=true), with production settings.
      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Run the image and check it is ready
        run: |
          docker run -d --name api --network host             -e NODE_ENV=production -e MIGRATE_ON_START=true -e PORT=4000             -e DATABASE_URL=postgres://nexus:nexus@localhost:5432/nexus             -e JOBS_DATABASE_URL=postgres://nexus:nexus@localhost:5432/nexus             -e JWT_SECRET="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"             -e APP_URL=https://app.nexus.example nexus-api
          for i in $(seq 1 60); do curl -sf localhost:4000/readyz && break; sleep 2; done
          curl -sf localhost:4000/readyz
          curl -sf localhost:4000/v1/meta

      - name: API logs
        if: always()
        run: docker logs api 2>&1 | tail -50 || true
