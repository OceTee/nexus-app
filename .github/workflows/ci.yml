# CI stages 1 (static), 2 (unit) and 3 (database) from TDD Section I, CI pipeline stages.
# Stages 4-8 (preview DB, build, E2E, deploy, release) arrive in later phases.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Stage 1 - Static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Prettier
        run: pnpm format:check

      # Scans the full history with the pinned gitleaks image. The gitleaks
      # action scans only the pushed range and fails when that range starts at
      # the root commit (for example after a history rewrite).
      - name: Secret scan
        # safe.directory: the container user differs from the checkout's owner.
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Dependency audit
        run: pnpm audit --audit-level high

  unit:
    name: Stage 2 - Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage
        run: pnpm turbo run test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: ignore
          retention-days: 14

  database:
    name: Stage 3 - Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations match the schema
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name ci_drift_check | tee drift.log
          if ! grep -q "No schema changes" drift.log; then
            echo "src/db/schema has changes without a committed migration. Run pnpm db:generate."
            exit 1
          fi

      - name: Database tests (PostgreSQL 18 via Testcontainers)
        run: pnpm --filter @nexus/api test:db
