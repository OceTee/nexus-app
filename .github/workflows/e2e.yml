# CI stage 6 (TDD Section I): Maestro end-to-end flows on an Android emulator,
# against the real API, Postgres and MinIO. Nightly and on demand.
name: E2E

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  # Also when the suite, this workflow, or the app or API code changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e.yml'
      - 'apps/mobile/.maestro/**'
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/api/src/**'
      - 'packages/shared/src/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    name: Stage 6 - E2E (Maestro, Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      APP_ENV: development
      CI: 'true'
      # Baked into the release bundle: E2E mode (cleartext to localhost, no
      # LogBox) and the API reached through `adb reverse`.
      EXPO_PUBLIC_E2E: '1'
      EXPO_PUBLIC_API_URL: http://localhost:4000
      # Slow CI emulators need longer than the 15 s default to start the driver.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # --- Backend: Postgres + MinIO from docker compose, the API in E2E mode --
      - name: Start Postgres and MinIO
        run: docker compose up -d --wait postgres minio && docker compose up minio-init

      - name: Configure the API
        working-directory: apps/api
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')|" .env
          sed -i "s|^RATE_LIMIT_STORE=.*|RATE_LIMIT_STORE=memory|" .env
          sed -i "s|^E2E_MODE=.*|E2E_MODE=true|" .env

      - name: Migrate and build the API
        working-directory: apps/api
        run: pnpm db:migrate && pnpm build

      - name: Start the API
        working-directory: apps/api
        run: |
          nohup node --env-file=.env dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:4000/readyz && break; sleep 2; done
          curl -sf localhost:4000/readyz

      # --- App: a release build with the JS bundle embedded (no Metro, dev menu
      # or LogBox), as Expo's E2E guide and Maestro recommend ------------------
      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain

      # A pinned release, downloaded with retries: the install script piped into
      # bash reported success while installing nothing when GitHub's release
      # downloads were timing out.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.12.1
        run: |
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" "$url" && break
            echo "Download attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
          "$HOME/maestro/bin/maestro" --version

      # --- Emulator + flows --------------------------------------------------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: apps/mobile
          script: bash .maestro/ci.sh

      - name: Upload Maestro results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/api.log
          retention-days: 14
