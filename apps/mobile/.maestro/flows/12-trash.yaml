# Trash: delete a note, find it in Trash, restore it.
appId: com.gladprosper.nexus.development
name: Trash and restore
tags: [offline]
---
- runFlow: ../subflows/start-offline.yaml
- runFlow:
    file: ../subflows/new-note.yaml
    env:
      TITLE: 'Old idea'
      BODY: 'Maybe not.'
- longPressOn: 'Old idea'
- tapOn: 'Delete'
- assertVisible: '“Old idea” moved to Trash'
- assertNotVisible: 'Old idea'
# The action sheet may still be fading out on a slow emulator and swallow the
# first tap on the tab bar, so wait and retry the tab tap once.
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn: 'Settings'
      - extendedWaitUntil:
          visible: 'Trash'
          timeout: 5000
- tapOn: 'Trash'
- assertVisible: 'Old idea'
- tapOn: 'Restore Old idea'
- assertVisible: 'Restored “Old idea”'
- tapOn: 'Back'
- tapOn: 'Notes'
- assertVisible: 'Old idea'
