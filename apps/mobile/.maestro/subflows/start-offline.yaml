# Fresh install, then "Continue offline" (no account, nothing syncs).
appId: com.gladprosper.nexus.development
---
# The runner (run.mjs) clears app data before each flow.
- launchApp
# Slow CI emulators sometimes show "… isn't responding"; keep waiting.
- tapOn:
    text: 'Wait'
    optional: true
- extendedWaitUntil:
    visible: 'Continue offline'
    timeout: 120000
- tapOn: 'Continue offline'
- extendedWaitUntil:
    visible: 'Notes'
    timeout: 30000
